name: Validate KON COFFEE LIVE

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/kon-live-recovery

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check server and browser scripts
        run: npm run check

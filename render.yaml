services:
  - type: web
    name: kon-coffee-live-test
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TIKTOK_USERNAME
        value: kon.coffee
      - key: ADMIN_AUTH_DISABLED
        value: 'true'